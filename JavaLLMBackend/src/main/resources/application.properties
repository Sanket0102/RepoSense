spring.application.name=JavaLLMBackend

spring.datasource.url=jdbc:mysql://localhost:3306/llmapp
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.format_sql=true
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.location=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.ai.google.genai.project-id=gen-lang-client-0303954083
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.project-id=12454661970
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=llm_application
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.use-tls=false

spring.security.oauth2.client.registration.github.client-id=Ov23li9h8ifmTwHLmqmE
spring.security.oauth2.client.registration.github.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.servlet.session.cookie.name=LLM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.timeout=7d

app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.token-encryptor-password=6c6c6d2d6c6f63616c2d656e63727970742d6b6579
app.token-encryptor-salt=deadbeefcafebabe

app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50

app.github.base.url=https://api.github.com







